name: Build Sonic Boll Deluxe Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT SONIC BOLL PROJECT
      # ============================================================

      - name: Checkout Sonic Boll
        uses: actions/checkout@v4
        with:
          path: sonic-project


      # ============================================================
      # CHECKOUT WINLATOR
      # ============================================================

      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator
          path: winlator-source
          submodules: recursive
          fetch-depth: 1


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # ============================================================
      # INSTALL ONLY THE REQUIRED SDK PACKAGES
      # ============================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"


      # ============================================================
      # FIND GAME.ZIP
      # ============================================================

      - name: Find Sonic Boll game.zip
        shell: bash
        run: |
          set -e

          GAME_ZIP="$(find "$GITHUB_WORKSPACE/sonic-project" \
            -type f \
            -name "game.zip" \
            -print -quit)"

          if [ -z "$GAME_ZIP" ]; then
            echo "ERROR: game.zip was not found."
            echo
            echo "Put game.zip somewhere inside the Sonic Boll repository."
            exit 1
          fi

          echo "Found:"
          echo "$GAME_ZIP"

          mkdir -p \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets"

          cp "$GAME_ZIP" \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"

          ls -lh \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"


      # ============================================================
      # INSTALL LOGO
      # ============================================================

      - name: Install Sonic Boll logo
        shell: bash
        run: |
          set -e

          DRAWABLE="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/drawable-nodpi"

          mkdir -p "$DRAWABLE"

          LOGO="$(find "$GITHUB_WORKSPACE/sonic-project" \
            -type f \
            -name "sonic_kiosk_logo.png" \
            -print -quit)"

          if [ -n "$LOGO" ]; then
            echo "Using logo:"
            echo "$LOGO"

            cp "$LOGO" \
              "$DRAWABLE/sonic_kiosk_logo.png"
          else
            echo "ERROR: sonic_kiosk_logo.png was not found."
            exit 1
          fi


      # ============================================================
      # CUSTOM INSTALLATION SCREEN
      # ============================================================

      - name: Create Sonic Boll installation screen
        shell: bash
        run: |
          set -e

          LAYOUT="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/layout/download_progress_dialog.xml"

          mkdir -p "$(dirname "$LAYOUT")"

          cat > "$LAYOUT" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#000000">

              <ImageView
                  android:id="@+id/SonicLogo"
                  android:layout_width="140dp"
                  android:layout_height="140dp"
                  android:layout_marginBottom="20dp"
                  android:src="@drawable/sonic_kiosk_logo"
                  android:scaleType="fitCenter"
                  android:contentDescription="Sonic Boll Deluxe" />

              <TextView
                  android:id="@+id/Title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="SONIC BOLL DELUXE"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:layout_marginBottom="10dp" />

              <TextView
                  android:id="@+id/TextView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Installing Sonic Boll Deluxe..."
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:gravity="center"
                  android:layout_marginBottom="20dp" />

              <com.google.android.material.progressindicator.CircularProgressIndicator
                  android:id="@+id/CircularProgressIndicator"
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:indeterminate="false"
                  android:max="100"
                  app:indicatorSize="70dp"
                  app:trackThickness="6dp" />

              <TextView
                  android:id="@+id/TVProgress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0%"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:layout_marginTop="14dp" />

              <LinearLayout
                  android:id="@+id/LLBottomBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:visibility="gone">

                  <Button
                      android:id="@+id/BTCancel"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Cancel" />

              </LinearLayout>

          </LinearLayout>
          EOF


      # ============================================================
      # CREATE SONIC BOLL INSTALLER
      # ============================================================

      - name: Create Sonic Boll installer
        shell: bash
        run: |
          set -e

          JAVA_DIR="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator"

          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/SonicBollInstaller.java" <<'EOF'
          package com.winlator;

          import android.content.Context;

          import com.winlator.xenvironment.RootFS;

          public class SonicBollInstaller {

              public static void installIfNeeded(
                      final MainActivity activity) {

                  RootFS rootFS = RootFS.find(activity);

                  if (rootFS == null) {
                      return;
                  }

                  if (!rootFS.isValid()) {
                      return;
                  }

                  /*
                   * Sonic Boll installation will be performed
                   * after the Winlator RootFS is ready.
                   *
                   * The game ZIP is bundled in the APK as:
                   *
                   * assets/game.zip
                   */

                  android.util.Log.d(
                      "SonicBollInstaller",
                      "Winlator RootFS ready for Sonic Boll"
                  );
              }
          }
          EOF


      # ============================================================
      # HOOK SONIC BOLL AFTER ROOTFS
      # ============================================================

      - name: Hook Sonic Boll into RootFS installation
        shell: bash
        run: |
          set -e

          TARGET="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java"

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: RootFSInstaller.java not found:"
            echo "$TARGET"
            exit 1
          fi

          python3 - "$TARGET" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          hook = "SonicBollInstaller.installIfNeeded(activity);"

          if hook in text:
              print("Sonic Boll hook already exists.")
              sys.exit(0)

          # Add import if needed.
          import_line = "import com.winlator.SonicBollInstaller;"

          if import_line not in text:

              lines = text.splitlines()

              insert_at = 0

              for i, line in enumerate(lines):

                  if line.startswith("import "):
                      insert_at = i + 1

              lines.insert(insert_at, import_line)

              text = "\n".join(lines)

          # --------------------------------------------------------
          # Do NOT depend on indentation.
          #
          # Find the existing resetContainerRFSVersions call and
          # put our hook immediately after it.
          # --------------------------------------------------------

          target_line = "resetContainerRFSVersions(activity);"

          if target_line not in text:
              print(
                  "ERROR: resetContainerRFSVersions(activity); "
                  "was not found."
              )
              sys.exit(1)

          text = text.replace(
              target_line,
              target_line + "\n                " + hook,
              1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Sonic Boll RootFS hook installed.")
          PY


      # ============================================================
      # VERIFY PATCH
      # ============================================================

      - name: Verify Sonic Boll modifications
        shell: bash
        run: |
          set -e

          ROOTFS="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java"

          INSTALLER="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/SonicBollInstaller.java"

          ZIP="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"

          LAYOUT="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/layout/download_progress_dialog.xml"

          grep -q "SonicBollInstaller.installIfNeeded(activity);" "$ROOTFS"

          test -f "$INSTALLER"
          test -f "$ZIP"
          test -f "$LAYOUT"

          echo "=========================================="
          echo "Sonic Boll files verified."
          echo "=========================================="

          echo
          echo "RootFS hook:"
          grep -n "SonicBollInstaller" "$ROOTFS"

          echo
          echo "Game ZIP:"
          ls -lh "$ZIP"


      # ============================================================
      # GRADLE MEMORY CONFIGURATION
      # ============================================================

      - name: Configure Gradle
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/winlator-source/app/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build Winlator APK
        working-directory
