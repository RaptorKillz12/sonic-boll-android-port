name: Build Sonic Boll Deluxe Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ------------------------------------------------------------
      # 1. Checkout your Sonic Boll repository
      # ------------------------------------------------------------
      - name: Checkout Sonic Boll project
        uses: actions/checkout@v4
        with:
          path: sonic-project

      # ------------------------------------------------------------
      # 2. Checkout current Winlator source + submodules
      # ------------------------------------------------------------
      - name: Checkout Winlator
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator
          path: winlator-source
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Java
      # ------------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # 4. Android SDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      # ------------------------------------------------------------
      # 5. Make sure Gradle wrapper is executable
      # ------------------------------------------------------------
      - name: Prepare Gradle
        working-directory: winlator-source/app
        run: |
          chmod +x gradlew

      # ------------------------------------------------------------
      # 6. Find game.zip
      #
      # Put game.zip anywhere in your Sonic Boll repository.
      # The workflow searches for it automatically.
      # ------------------------------------------------------------
      - name: Locate game.zip
        shell: bash
        run: |
          GAME_ZIP="$(find "$GITHUB_WORKSPACE/sonic-project" \
            -type f \
            -name "game.zip" \
            -print -quit)"

          if [ -z "$GAME_ZIP" ]; then
            echo "ERROR: game.zip was not found."
            echo
            echo "Put your Sonic Boll game files into:"
            echo "game.zip"
            echo
            echo "inside the repository."
            exit 1
          fi

          echo "Found game.zip:"
          echo "$GAME_ZIP"

          mkdir -p "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets"

          cp "$GAME_ZIP" \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"

          ls -lh \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"

      # ------------------------------------------------------------
      # 7. Add Sonic Boll logo
      #
      # If sonic_kiosk_logo.png exists in your repo, use it.
      # Otherwise create a fallback logo so the build doesn't fail.
      # ------------------------------------------------------------
      - name: Install Sonic Boll logo
        shell: bash
        run: |
          DRAWABLE="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/drawable-nodpi"

          mkdir -p "$DRAWABLE"

          LOGO="$(find "$GITHUB_WORKSPACE/sonic-project" \
            -type f \
            \( \
              -name "sonic_kiosk_logo.png" \
              -o -name "sonic_kiosk_logo.webp" \
            \) \
            -print -quit)"

          if [ -n "$LOGO" ]; then
            echo "Using Sonic Boll logo:"
            echo "$LOGO"

            cp "$LOGO" \
              "$DRAWABLE/sonic_kiosk_logo.png"
          else
            echo "No logo found. Creating fallback logo."

            cat > "$DRAWABLE/sonic_kiosk_logo.xml" <<'EOF'
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="160dp"
                android:height="160dp"
                android:viewportWidth="160"
                android:viewportHeight="160">

                <path
                    android:fillColor="#FFFFFFFF"
                    android:pathData="M80,8
                    C42,8 14,34 14,72
                    C14,103 35,126 66,134
                    C87,140 111,135 128,121
                    C136,114 141,105 141,94
                    C141,80 132,70 119,67
                    C107,64 96,68 88,75
                    C81,81 75,82 69,78
                    C63,74 63,66 68,60
                    C75,52 88,50 100,53
                    L113,26
                    C102,14 92,8 80,8 Z" />
            </vector>
            EOF
          fi

      # ------------------------------------------------------------
      # 8. Custom first-launch installation screen
      # ------------------------------------------------------------
      - name: Create Sonic Boll installation screen
        shell: bash
        run: |
          LAYOUT="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/layout/download_progress_dialog.xml"

          mkdir -p "$(dirname "$LAYOUT")"

          cat > "$LAYOUT" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#000000">

              <ImageView
                  android:id="@+id/SonicLogo"
                  android:layout_width="130dp"
                  android:layout_height="130dp"
                  android:layout_marginBottom="20dp"
                  android:src="@drawable/sonic_kiosk_logo"
                  android:scaleType="fitCenter"
                  android:contentDescription="Sonic Boll Deluxe" />

              <TextView
                  android:id="@+id/Title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="SONIC BOLL DELUXE"
                  android:textColor="#FFFFFF"
                  android:textSize="25sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:layout_marginBottom="10dp" />

              <TextView
                  android:id="@+id/TextView"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Installing Sonic Boll Deluxe..."
                  android:textColor="#FFFFFF"
                  android:textSize="17sp"
                  android:gravity="center"
                  android:layout_marginBottom="20dp" />

              <com.google.android.material.progressindicator.CircularProgressIndicator
                  android:id="@+id/CircularProgressIndicator"
                  android:layout_width="90dp"
                  android:layout_height="90dp"
                  android:indeterminate="false"
                  android:max="100"
                  app:indicatorSize="80dp"
                  app:trackThickness="7dp" />

              <TextView
                  android:id="@+id/TVProgress"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="0%"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:layout_marginTop="15dp" />

              <LinearLayout
                  android:id="@+id/LLBottomBar"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:visibility="gone">

                  <Button
                      android:id="@+id/BTCancel"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Cancel" />

              </LinearLayout>

          </LinearLayout>
          EOF

      # ------------------------------------------------------------
      # 9. Create SonicBollInstaller.java
      # ------------------------------------------------------------
      - name: Create Sonic Boll installer
        shell: bash
        run: |
          JAVA_DIR="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator"

          mkdir -p "$JAVA_DIR"

          cat > "$JAVA_DIR/SonicBollInstaller.java" <<'EOF'
          package com.winlator;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Handler;
          import android.os.Looper;

          import com.winlator.container.Container;
          import com.winlator.container.ContainerManager;
          import com.winlator.core.FileUtils;
          import com.winlator.xenvironment.RootFS;

          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public class SonicBollInstaller {

              private static final String MARKER = ".sonic_boll_installed";
              private static final String CONTAINER_NAME = "Sonic Boll Deluxe";

              public static void installIfNeeded(final MainActivity activity) {

                  RootFS rootFS = RootFS.find(activity);

                  if (!rootFS.isValid()) {
                      return;
                  }

                  File marker = new File(rootFS.getRootDir(), MARKER);

                  if (marker.isFile()) {
                      return;
                  }

                  new Thread(() -> install(activity)).start();
              }

              private static void install(final MainActivity activity) {

                  try {

                      RootFS rootFS = RootFS.find(activity);

                      if (!rootFS.isValid()) {
                          return;
                      }

                      File marker = new File(rootFS.getRootDir(), MARKER);

                      if (marker.isFile()) {
                          return;
                      }

                      JSONObject data = new JSONObject();

                      data.put("name", CONTAINER_NAME);
                      data.put("screenSize", "1280x720");
                      data.put("envVars", Container.DEFAULT_ENV_VARS);
                      data.put("graphicsDriver",
                              Container.DEFAULT_ENV_VARS.contains("ZINK")
                              ? "vulkan,zink"
                              : "vulkan,gl");
                      data.put("dxwrapper", Container.DEFAULT_DXWRAPPER);
                      data.put("audioDriver", Container.DEFAULT_AUDIO_DRIVER);
                      data.put("wincomponents", Container.DEFAULT_WINCOMPONENTS);
                      data.put("drives", Container.DEFAULT_DRIVES);
                      data.put("startupSelection", Container.STARTUP_SELECTION_ESSENTIAL);
                      data.put("box64Preset", "intermediate");
                      data.put("desktopTheme", "default");
                      data.put("extraData", new JSONObject());

                      ContainerManager manager =
                              new ContainerManager(activity);

                      manager.createContainerAsync(
                              data,
                              container -> {

                                  if (container == null) {
                                      return;
                                  }

                                  try {

                                      File userDir =
                                              container.getUserDir();

                                      File desktopDir =
                                              new File(userDir, "Desktop");

                                      if (!desktopDir.exists()) {
                                          desktopDir.mkdirs();
                                      }

                                      File gameDir =
                                              new File(
                                                  container.getRootDir(),
                                                  ".wine/drive_c/Program Files/Sonic Boll Deluxe"
                                              );

                                      if (!gameDir.exists()) {
                                          gameDir.mkdirs();
                                      }

                                      extractGame(
                                              activity,
                                              gameDir
                                      );

                                      File exe =
                                              findFile(
                                                  gameDir,
                                                  "Boll Deluxe.exe"
                                              );

                                      if (exe == null) {
                                          return;
                                      }

                                      String dosPath =
                                              "C:\\Program Files\\Sonic Boll Deluxe\\"
                                              + relativePath(
                                                  gameDir,
                                                  exe
                                              );

                                      File desktop =
                                              new File(
                                                  desktopDir,
                                                  "Sonic Boll Deluxe.desktop"
                                              );

                                      String desktopText =
                                              "[Desktop Entry]\\n"
                                              + "Name=Sonic Boll Deluxe\\n"
                                              + "Type=Application\\n"
                                              + "Exec=wine "
                                              + dosPath
                                              + "\\n"
                                              + "Icon=sonic_boll\\n"
                                              + "StartupWMClass=Boll Deluxe.exe\\n";

                                      FileUtils.writeString(
                                              desktop,
                                              desktopText
                                      );

                                      createMarker(
                                              marker
                                      );

                                      new Handler(
                                              Looper.getMainLooper()
                                      ).postDelayed(
                                              () -> launchGame(
                                                      activity,
                                                      container,
                                                      desktop
                                              ),
                                              1000
                                      );

                                  }
                                  catch (Exception e) {
                                      e.printStackTrace();
                                  }

                              }
                      );

                  }
                  catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private static void extractGame(
                      Context context,
                      File destination
              ) throws Exception {

                  InputStream input =
                          context.getAssets().open("game.zip");

                  ZipInputStream zip =
                          new ZipInputStream(input);

                  byte[] buffer =
                          new byte[8192];

                  ZipEntry entry;

                  while ((entry = zip.getNextEntry()) != null) {

                      String name = entry.getName();

                      if (name.contains("..")) {
                          zip.closeEntry();
                          continue;
                      }

                      File output =
                              new File(destination, name);

                      String destinationPath =
                              destination
                                      .getCanonicalPath();

                      String outputPath =
                              output
                                      .getCanonicalPath();

                      if (!outputPath.startsWith(
                              destinationPath
                                      + File.separator
                      )) {
                          zip.closeEntry();
                          continue;
                      }

                      if (entry.isDirectory()) {

                          output.mkdirs();

                      }
                      else {

                          File parent =
                                  output.getParentFile();

                          if (parent != null) {
                              parent.mkdirs();
                          }

                          FileOutputStream fos =
                                  new FileOutputStream(output);

                          int count;

                          while ((count =
                                  zip.read(buffer)) != -1) {

                              fos.write(
                                      buffer,
                                      0,
                                      count
                              );
                          }

                          fos.close();

                          output.setExecutable(
                                  true,
                                  false
                          );
                      }

                      zip.closeEntry();
                  }

                  zip.close();
              }

              private static File findFile(
                      File directory,
                      String filename
              ) {

                  File[] files =
                          directory.listFiles();

                  if (files == null) {
                      return null;
                  }

                  for (File file : files) {

                      if (file.isFile()
                              && file.getName()
                              .equalsIgnoreCase(filename)) {

                          return file;
                      }

                      if (file.isDirectory()) {

                          File result =
                                  findFile(
                                      file,
                                      filename
                                  );

                          if (result != null) {
                              return result;
                          }
                      }
                  }

                  return null;
              }

              private static String relativePath(
                      File root,
                      File file
              ) {

                  String rootPath =
                          root.getAbsolutePath();

                  String filePath =
                          file.getAbsolutePath();

                  if (filePath.startsWith(
                          rootPath + File.separator
                  )) {

                      return filePath.substring(
                              rootPath.length()
                                      + 1
                      ).replace(
                              File.separatorChar,
                              '\\'
                      );
                  }

                  return file.getName();
              }

              private static void createMarker(
                      File marker
              ) {

                  try {

                      marker.getParentFile().mkdirs();
                      marker.createNewFile();

                  }
                  catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              private static void launchGame(
                      MainActivity activity,
                      Container container,
                      File desktop
              ) {

                  try {

                      Intent intent =
                              new Intent(
                                      activity,
                                      XServerDisplayActivity.class
                              );

                      intent.putExtra(
                              "container_id",
                              container.id
                      );

                      intent.putExtra(
                              "shortcut_path",
                              desktop.getAbsolutePath()
                      );

                      activity.startActivity(intent);

                  }
                  catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      # ------------------------------------------------------------
      # 10. Hook Sonic Boll installer into RootFSInstaller
      # ------------------------------------------------------------
      - name: Hook Sonic Boll into RootFS installation
        shell: bash
        run: |
          TARGET="$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java"

          python3 - "$TARGET" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Add import.
          import_line = "import com.winlator.SonicBollInstaller;"

          if import_line not in text:
              text = text.replace(
                  "import com.winlator.MainActivity;",
                  "import com.winlator.MainActivity;\n" + import_line,
                  1
              )

          # Exact current Winlator success block.
          old = """if (success) {
                  rootFS.createRFSVersionFile(LATEST_VERSION);
                  resetContainerRFSVersions(activity);
              }"""

          new = """if (success) {
                  rootFS.createRFSVersionFile(LATEST_VERSION);
                  resetContainerRFSVersions(activity);
                  SonicBollInstaller.installIfNeeded(activity);
              }"""

          if "SonicBollInstaller.installIfNeeded(activity);" not in text:

              if old not in text:
                  print("ERROR: RootFS success block was not found.")
                  print("The current RootFSInstaller.java does not match the expected source.")
                  sys.exit(1)

              text = text.replace(old, new, 1)

          # Also handle an already-installed RootFS.
          old_needed = """public static void installIfNeeded(final MainActivity activity) {
              RootFS rootFS = RootFS.find(activity);
              if (!rootFS.isValid() || rootFS.getVersion() < LATEST_VERSION) install(activity);
          }"""

          new_needed = """public static void installIfNeeded(final MainActivity activity) {
              RootFS rootFS = RootFS.find(activity);
              if (!rootFS.isValid() || rootFS.getVersion() < LATEST_VERSION) {
                  install(activity);
              }
              else {
                  SonicBollInstaller.installIfNeeded(activity);
              }
          }"""

          if old_needed in text:
              text = text.replace(old_needed, new_needed, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("RootFSInstaller successfully patched.")
          PY

      # ------------------------------------------------------------
      # 11. Make ZIP available as an uncompressed APK asset
      # ------------------------------------------------------------
      - name: Configure game.zip packaging
        shell: bash
        run: |
          GRADLE="$GITHUB_WORKSPACE/winlator-source/app/app/build.gradle"

          python3 - "$GRADLE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          if "noCompress" not in text:
              marker = "android {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n    aaptOptions {\n        noCompress 'zip'\n    }\n",
                      1
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("APK ZIP compression configuration applied.")
          PY

      # ------------------------------------------------------------
      # 12. Verify important files
      # ------------------------------------------------------------
      - name: Verify build files
        shell: bash
        run: |
          test -f \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/assets/game.zip"

          test -f \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/SonicBollInstaller.java"

          test -f \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java"

          test -f \
            "$GITHUB_WORKSPACE/winlator-source/app/app/src/main/res/layout/download_progress_dialog.xml"

          echo "All required files exist."

      # ------------------------------------------------------------
      # 13. Build APK
      # ------------------------------------------------------------
      - name: Build debug APK
        working-directory: winlator-source/app
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          ./gradlew --no-daemon assembleDebug

      # ------------------------------------------------------------
      # 14. Show APK
      # ------------------------------------------------------------
      - name: Locate APK
        shell: bash
        run: |
          find \
            "$GITHUB_WORKSPACE/winlator-source/app/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

      # ------------------------------------------------------------
      # 15. Upload APK
      # ------------------------------------------------------------
      - name: Upload Sonic Boll APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-Boll-Deluxe-Android
          path: |
            winlator-source/app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
