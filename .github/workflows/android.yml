name: Build Sonic Boll Winlator APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Clone Winlator, Patch MainActivity & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Port Repository
        uses: actions/checkout@v4
        with:
          path: port-src

      - name: Clone Winlator Source Repository (With Submodules)
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator
          path: winlator-src
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Create Required Assets and Layout Directories
        run: |
          mkdir -p winlator-src/app/src/main/assets/
          mkdir -p winlator-src/app/src/main/res/layout/
          mkdir -p winlator-src/app/src/main/java/com/winlator/

      - name: Download Game Zip from Dropbox
        run: |
          curl -L -o winlator-src/app/src/main/assets/game.zip "https://www.dropbox.com/scl/fi/b1niwoyxm6kb64utk4w3i/game.zip?rlkey=pymghznnk4phoow743wzpziki&st=22qhf8rk&dl=1"

      - name: Override Layout XML (Image + Text + Space + Text + ProgressBar)
        run: |
          cat << 'EOF' > winlator-src/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#000000"
              android:padding="24dp">

              <!-- 1. Image -->
              <ImageView
                  android:id="@+id/splash_image"
                  android:layout_width="220dp"
                  android:layout_height="220dp"
                  android:src="@mipmap/ic_launcher"
                  android:scaleType="fitCenter" />

              <!-- 2. Text Underneath -->
              <TextView
                  android:id="@+id/splash_title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="Sonic Boll Deluxe"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp"
                  android:textStyle="bold" />

              <!-- 3. Space -->
              <Space
                  android:layout_width="match_parent"
                  android:layout_height="32dp" />

              <!-- 4. Secondary Text -->
              <TextView
                  android:id="@+id/splash_status"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Extracting game files, please wait..."
                  android:textColor="#AAAAAA"
                  android:textSize="14sp" />

              <!-- 5. ProgressBar -->
              <ProgressBar
                  android:id="@+id/splash_progressbar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="240dp"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:indeterminate="true" />

          </LinearLayout>
          EOF

      - name: Override MainActivity Java Source
        run: |
          cat << 'EOF' > winlator-src/app/src/main/java/com/winlator/MainActivity.java
          package com.winlator;

          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import com.winlator.container.Container;
          import com.winlator.container.ContainerManager;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  new Thread(() -> {
                      extractGameZipIfNeeded();
                      new Handler(Looper.getMainLooper()).post(this::launchContainer);
                  }).start();
              }

              private void extractGameZipIfNeeded() {
                  File targetDir = new File(getFilesDir(), "image/drive_c/SonicBoll");
                  if (!targetDir.exists()) {
                      targetDir.mkdirs();
                      try (InputStream is = getAssets().open("game.zip");
                           ZipInputStream zis = new ZipInputStream(is)) {
                          ZipEntry entry;
                          byte[] buffer = new byte[8192];
                          while ((entry = zis.getNextEntry()) != null) {
                              File file = new File(targetDir, entry.getName());
                              if (entry.isDirectory()) {
                                  file.mkdirs();
                              } else {
                                  file.getParentFile().mkdirs();
                                  try (FileOutputStream fos = new FileOutputStream(file)) {
                                      int count;
                                      while ((count = zis.read(buffer)) != -1) {
                                          fos.write(buffer, 0, count);
                                      }
                                  }
                              }
                              zis.closeEntry();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }
              }

              private void launchContainer() {
                  try {
                      ContainerManager manager = new ContainerManager(this);
                      Container container = manager.getContainers().isEmpty() 
                          ? manager.createContainer(Container.DEFAULT_CONFIG) 
                          : manager.getContainers().get(0);

                      XServerDisplayActivity.launchWithExecutable(this, container, "C:\\SonicBoll\\SonicBoll.exe");
                      finish();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Inject Custom Code and Overrides
        run: |
          if [ -d "port-src/overrides" ]; then
            cp -r port-src/overrides/* winlator-src/app/
          fi

          if [ -d "port-src/assets" ]; then
            cp -r port-src/assets/* winlator-src/app/src/main/assets/
          fi

      - name: Setup Gradle Wrapper and Build APK
        run: |
          if [ -f "winlator-src/gradlew" ]; then
            cd winlator-src
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "winlator-src/app/gradlew" ]; then
            cd winlator-src/app
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            cd winlator-src
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Find and Copy Output APK
        run: |
          mkdir -p output_apk
          find winlator-src/ -type f -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-boll-winlator-debug
          path: output_apk/*.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
